", "C": "Cross-model copy step", "D": "Save step", "E": "Advanced formulas step"}, "correct": ["B", "C", "E"]}, {"id": 101, "type": "Multiple", "question": "As an administrator, users are complaining that their data actions are running slower than normal. What should you do? There are two correct answers.", "options": {"A": "Run everyone's data actions to identify the system performance issues that need to be resolved.", "B": "Use the Performance Decision Tree to find resources to resolve performance issues.", "C": "Use the built-in Statistics and Analysis performance tool to analyze and manage system performance."}, "correct": ["B", "C"]}, {"id": 102, "type": "Simple", "question": "When using a cross-model copy step in a data action, what must you include? Choose the correct answer.", "options": {"A": "A parameter to determine the source model.", "B": "A filter on the Version dimension to choose which version to copy from.", "C": "A parameter to determine the target model."}, "correct": ["B"]}, {"id": 103, "type": "Simple", "question": "How can you make a copy step more flexible for the end users? Choose the correct answer.", "options": {"A": "Add a variable to the source system (SAP BW, BW/4HANA, or S/4HANA).", "B": "Use SAP Analytics Cloud's Input Task collaboration option to solicit their input.", "C": "Use a parameter to allow them to choose dimension members."}, "correct": ["C"]}, {"id": 104, "type": "Multiple", "question": "Which of the following statements about data actions with advanced formula steps are true? There are two correct answers.", "options": {"A": "The results of an advanced formula step are not stored in the SAP Analytics Cloud database.", "B": "The visual editor is a graphical wizard that helps visually build scripts.", "C": "It is not possible to switch between the visual and script editors.", "D": "The script editor includes validation and trace mode."}, "correct": ["B", "D"]}, {"id": 105, "type": "Multiple", "question": "Where can you crea : "In the Timeframe section of the Forecast Layout panel, which fields do you have to configure when creating a Rolling Forecast? There are three correct answers.", "options": {"A": "Cut-Over Date", "B": "Layout", "C": "Look Ahead", "D": "Look Back", "E": "Type"}, "correct": ["C", "D", "E"]}, {"id": 120, "type": "Multiple", "question": "The communications tools used to collaborate in planning include: There are two correct answers.", "options": {"A": "Comments", "B": "Calendar", "C": "Story", "D": "Version"}, "correct": ["A", "B"]}, {"id": 121, "type": "Multiple", "question": "Which of the following statements about data locking tasks in planning processes are true? There are two correct answers.", "options": {"A": "Data locking tasks help you to track planning processes.", "B": "Data locking tasks ensures that model data is locked at the right time.", "C": "Data locking tasks must be used in each planning process you create.", "D": "Data locking tasks can only be used as part of a planning process."}, "correct": ["A", "B"]}, {"id": 122, "type": "Simple", "question": "In a planning process, a Reviewer is required. Choose the correct answer.", "options": {"A": "True", "B": "False"}, "correct": ["B"]}, {"id": 123, "type": "Simple", "question": "Where is a Process created? Choose the correct answer.", "options": {"A": "Calendar", "B": "Data action", "C": "Model", "D": "Story"}, "correct": ["A"]}];
let exam=[];let idx=0;let session=[];
function prog(){return JSON.parse(localStorage.getItem('sac_v3')||'{}');}
function save(p){localStorage.setItem('sac_v3',JSON.stringify(p));}
function stats(){
 let p=prog(); let mastered=0;
 QUESTIONS.forEach(q=>{if((p[q.id]?.hits||0)>=3) mastered++;});
 document.getElementById('stats').innerHTML=`Total ${QUESTIONS.length} | Dominadas ${mastered} | Pendientes ${QUESTIONS.length-mastered}`;
}
function startExam(){
 let p=prog();
 let active=QUESTIONS.filter(q=>((p[q.id]?.hits||0)<3));
 active.sort((a,b)=>((p[a.id]?.fails||0)-(p[b.id]?.fails||0)));
 active=active.sort(()=>Math.random()-0.5);
 exam=active.slice(0,Math.min(40,active.length));
 idx=0; session=[]; render();
}
function render(){
 if(idx>=exam.length) return finish();
 let q=exam[idx];
 let h=`<div class='card'><h3>${idx+1}/${exam.length}</h3><p>${q.question}</p>`;
 for(let k in q.options) h+=`<label><input type='checkbox' value='${k}'> ${k}. ${q.options[k]}</label><br>`;
 h+=`<button onclick='answer()'>Responder</button><div id='r'></div></div>`;
 document.getElementById('app').innerHTML=h;
}
function answer(){
 let q=exam[idx];
 let sel=[...document.querySelectorAll('input:checked')].map(x=>x.value).sort();
 let cor=[...q.correct].sort();
 let ok=JSON.stringify(sel)==JSON.stringify(cor);
 session.push({id:q.id,ok});
 idx++; render();
}
function finish(){
 let p=prog(); let score=0;
 session.forEach(s=>{
   if(!p[s.id]) p[s.id]={hits:0,fails:0};
   if(s.ok){ p[s.id].hits +=1; score++; }
   else p[s.id].fails +=1;
 });
 save(p); stats();
 document.getElementById('app').innerHTML=`<h3>Examen terminado</h3><p>Puntaje: ${score}/${session.length}</p>`;
}
function resetAll(){localStorage.removeItem('sac_v3');stats();}
stats();
</script></body></html>
